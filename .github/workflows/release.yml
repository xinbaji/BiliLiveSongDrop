name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python build.py

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "from app import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliLiveSongDrop-windows-x64
          path: dist/BiliLiveSongDrop-windows-x64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: BiliLiveSongDrop v${{ steps.ver.outputs.version }}
          body: |
            ## 下载

            下载 `BiliLiveSongDrop-windows-x64.zip`，解压到任意目录运行 `BiliLiveSongDrop.exe`。

            > 需要 WebView2 运行时（Win11 自带）。

            ## 更新

            打包版内置在线更新：设置 → 关于 → 检查更新，会自动下载并覆盖安装。
          draft: false
          prerelease: false
          files: |
            dist/BiliLiveSongDrop-windows-x64.zip
